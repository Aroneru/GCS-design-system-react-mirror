<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon logo CEPLOK. Beberapa varian karena tiap browser memilih format
         yang berbeda: .ico untuk yang lawas, .png untuk sisanya. Sengaja tanpa
         varian .svg: `images/ceplok.svg` berisi raster ter-embed 1,5 MB, dan
         browser yang mendukung SVG akan memilihnya — jadi tiap kunjungan
         mengunduh 1,5 MB hanya untuk ikon 16px. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ceplok Design Kit — React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
