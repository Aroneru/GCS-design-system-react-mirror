# Membangun situs dokumentasi dan menerbitkannya ke GitHub Pages.
#
# Berjalan setiap kali ada push ke main — termasuk push yang datang dari
# mirror GitLab, karena mirror mendorong commit memakai PAT milik pengguna
# sehingga dianggap push biasa.
name: Deploy docs ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Biarkan satu deploy berjalan sampai selesai; push berikutnya menunggu,
# tidak saling menimpa.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Siapkan Pages
        id: pages
        uses: actions/configure-pages@v5

      # `npm run build` menjalankan `tsc -b` lebih dulu, jadi error tipe
      # menggagalkan deploy alih-alih diam-diam ikut terbit.
      - name: Build situs dokumentasi
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
